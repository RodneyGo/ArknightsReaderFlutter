name: ak_reader
description: "Arknights Story Reader — Flutter port (in progress)."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  # Unicode diacritic stripping — replicates the TS norm()'s NFD-decompose +
  # combining-mark strip (Dart core has no Unicode normalization).
  diacritic: ^0.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/guide_data.json
