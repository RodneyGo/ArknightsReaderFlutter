name: ak_reader
description: "Arknights Story Reader — Flutter port (in progress)."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  # Unicode diacritic stripping — replicates the TS norm()'s NFD-decompose +
  # combining-mark strip (Dart core has no Unicode normalization).
  diacritic: ^0.1.5
  # Key-value persistence for the stores (the localStorage stand-in).
  shared_preferences: ^2.3.2
  # Filesystem offline store (Capacitor Filesystem stand-in).
  path_provider: ^2.1.4
  path: ^1.9.0
  # State management / DI for the stores (composes with the ChangeNotifiers).
  provider: ^6.1.2
  # Android defaults apps to 60Hz; this requests the panel's highest refresh
  # mode so 90/120Hz devices actually run at their full rate.
  flutter_displaymode: ^0.7.0
  # Story SFX + looping background music. Chosen over audioplayers because
  # setUrl() throws on a bad url, which turns resolveSound()'s candidate-url
  # fallback chain into a plain try/catch.
  just_audio: ^0.10.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/guide_data.json
    # RU translation index only (fallback for first-run-offline); the overlays
    # themselves are fetched from GitHub — see lib/data/ru.dart.
    - assets/ru_index.json
    - assets/ChapterImages/
    - assets/EpisodeBackgrounds/
    - assets/StoryBackgrounds/
